services:
  app:
    container_name: test-messenger
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - PYTHONPATH=/app
      - JWT__SECRET_KEY=test_secret_key
      - JWT__ALGORITHM=HS256
      - JWT__COOKIE_NAME=access_token

  test-postgres:
    image: postgres:16
    container_name: test-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=messenger
    ports:
      - "6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 5
