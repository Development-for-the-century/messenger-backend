services:
  app:
    container_name: messenger
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "9999:9999"
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 5